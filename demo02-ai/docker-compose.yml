services:
  demo02-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-demo02-ai:latest}
    container_name: ${CONTAINER_NAME:-demo02-ai}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 .env 中配置 DEEPSEEK_API_KEY}
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s